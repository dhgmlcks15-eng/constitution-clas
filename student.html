<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헌법 가치 탐구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F7; --surface:#FFFFFF; --ink:#151A2C; --ink-2:#4A5068; --muted:#868CA0; --faint:#C4C8D4;
  --line:#E0E3EA; --value:#2747B5; --value-soft:#E8EDFB; --green:#0B7A5E; --green-soft:#E2F3EC; --red:#C2362B; --red-soft:#FBE9E7;
  --sheet:#FFFDF7; --rule:#EFE6CF; --focus:#2747B5;
  --serif:"Gowun Batang","Noto Serif KR","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F121B; --surface:#181C29; --ink:#E9EBF2; --ink-2:#B4B9C9; --muted:#80869A; --faint:#4A5064;
    --line:#2A3042; --value:#93A9FF; --value-soft:#1F2847; --green:#4CC9A1; --green-soft:#12302A; --red:#FF8A80; --red-soft:#3A1E1C;
    --sheet:#1D1F27; --rule:#2C2E38; --focus:#93A9FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F121B; --surface:#181C29; --ink:#E9EBF2; --ink-2:#B4B9C9; --muted:#80869A; --faint:#4A5064;
  --line:#2A3042; --value:#93A9FF; --value-soft:#1F2847; --green:#4CC9A1; --green-soft:#12302A; --red:#FF8A80; --red-soft:#3A1E1C;
  --sheet:#1D1F27; --rule:#2C2E38; --focus:#93A9FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.01em}
p,h1,h2,h3,dd,li,.idea,.quote,.lead,.hint,.small{text-wrap:pretty}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--value)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

.app{min-height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:16px 18px 20px}
.top{display:flex;align-items:center;gap:12px;height:40px}
.back{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:6px 8px;border-radius:8px;font-size:.95rem}
.back[hidden]{visibility:hidden;display:block!important}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s ease}
.stepno{font-size:.82rem;color:var(--muted);min-width:44px;text-align:right}

main{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:14px 0 20px}
.screen{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.bar i{transition:none}}
.kicker{font-size:.88rem;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--serif);font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.3;margin:0 0 8px}
h2{font-family:var(--serif);font-size:clamp(1.35rem,3.6vw,1.7rem);line-height:1.4;margin:0 0 6px}
.lead{color:var(--ink-2);margin:0 0 14px}
.foot{margin-top:auto;padding-top:14px;font-size:.78rem;color:var(--muted);text-align:center}

.btn{border:0;background:var(--ink);color:var(--surface);border-radius:14px;padding:15px 22px;cursor:pointer;font-weight:600;font-size:1.02rem;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:18px}
.row .btn{flex:1}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:16px;padding:16px 14px;text-align:left;cursor:pointer;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.tile .n{font-size:.8rem;color:var(--muted)}
.tile .t{font-family:var(--serif);font-size:1.15rem;line-height:1.35;font-weight:700}

.idea{font-family:var(--serif);font-size:clamp(1.2rem,3.2vw,1.45rem);line-height:1.65;margin:6px 0 14px;padding:18px 20px;background:var(--surface);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:6px 14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:.95rem}
.chip.on{background:var(--value);color:var(--surface);box-shadow:none}

#cloud{width:100%;height:300px;display:block;margin:4px 0}
#cloud text{cursor:pointer;transition:fill .25s}
#cloud text:hover,#cloud text:focus{text-decoration:underline;outline:none}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--value)}

.vcard{background:var(--surface);border-radius:22px;box-shadow:inset 0 0 0 1px var(--line);padding:28px 22px;text-align:center}
.vcard .word{font-family:var(--serif);font-size:clamp(2.2rem,8vw,3rem);font-weight:700;margin:4px 0 10px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.pick button{border:0;border-radius:16px;padding:18px 10px;cursor:pointer;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.pick button b{display:block;font-size:1.1rem}
.pick button span{font-size:.82rem;color:var(--muted)}
.feedback{margin-top:16px;text-align:left;border-radius:14px;padding:14px 16px;font-size:.98rem}
.feedback.ok{background:var(--green-soft)}
.feedback.no{background:var(--red-soft)}
.feedback b{display:block;margin-bottom:4px}
.opts{display:grid;gap:8px;margin-top:12px;text-align:left}
.opt{border:0;border-radius:12px;padding:12px 14px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;text-align:left;font-size:.95rem}
.opt b{margin-right:6px}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--value);background:var(--value-soft)}
.quote{font-family:var(--serif);font-size:1rem;line-height:1.85;margin:8px 0 0;white-space:pre-line}
mark{background:#FFE7A0;color:#151A2C;border-radius:2px;padding:0 1px}
input[type=text],textarea{width:100%;border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
textarea{resize:vertical;line-height:1.7}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}

.list{display:grid;gap:8px;max-height:52vh;overflow:auto;padding:2px}
.li{border:0;border-radius:14px;padding:12px 14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;text-align:left}
.li .r{font-size:.8rem;color:var(--muted)}
.li .p{font-family:var(--serif);font-size:.98rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 필사지 */
.sheet{position:relative;background:var(--sheet);border-radius:18px;padding:22px 24px 26px;box-shadow:0 1px 0 var(--line),inset 0 0 0 1px var(--rule)}
.sheet .ref{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.trace{position:relative;font-family:var(--serif);font-size:clamp(1.2rem,3.6vw,1.45rem);line-height:2.3em;word-break:break-all;white-space:pre-wrap;letter-spacing:.02em;
  background-image:linear-gradient(to bottom,transparent calc(100% - 1px),var(--rule) 0);background-size:100% 2.3em}
.trace .layer{margin:0;padding:0;min-height:2.3em}
.trace .layer .g{color:var(--faint)}
.trace .layer .k{color:var(--ink)}
.trace .layer .x{color:var(--red);background:var(--red-soft);border-radius:3px}
.trace .layer .c{color:var(--ink-2)}
.trace .layer .a{color:var(--ink-2)}
.trace .layer .caret{display:inline-block;width:2px;height:1.15em;margin:0 -1px;vertical-align:-.2em;background:var(--value);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.trace .layer .caret{animation:none}}
.trace textarea::selection{background:transparent}
.trace textarea{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;box-shadow:none;background:transparent;resize:none;overflow:hidden;
  color:transparent;caret-color:transparent;font:inherit;line-height:inherit;letter-spacing:inherit;word-break:break-all;white-space:pre-wrap;outline:none}
.meter{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.9rem;color:var(--ink-2)}
.meter .bar i{background:var(--green)}
.done{color:var(--green);font-weight:600}

.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:4px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 16px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.card{background:var(--surface);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);padding:20px 20px}
.card + .card{margin-top:12px}
.meta{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.res{font-weight:600;border-radius:6px;padding:1px 8px;font-size:.8rem;background:var(--value-soft);color:var(--value)}
.card h3{font-size:1.12rem;line-height:1.45;margin:6px 0 10px}
.card h3 a{color:inherit;text-underline-offset:3px;text-decoration-color:var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.kv dt{font-size:.8rem;color:var(--muted);padding-top:3px;white-space:nowrap}
.kv dd{margin:0;font-size:.98rem}
.conflict{border-radius:12px;padding:10px 14px;background:var(--green-soft);font-size:.95rem;margin:0 0 10px}
.conflict b{color:var(--green);margin-right:6px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--ink-2);font-size:.92rem}
.small{font-size:.9rem;color:var(--ink-2)}

.q{border:0;border-radius:16px;padding:16px 18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;text-align:left;font-family:var(--serif);font-size:1.08rem;line-height:1.6;width:100%}
.q + .q{margin-top:10px}
.q[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--value);background:var(--value-soft)}
.stance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stance button{border:0;border-radius:12px;padding:12px 6px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font-weight:600}
.stance button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.count{font-size:.82rem;color:var(--muted);text-align:right}
label.l{display:block;font-weight:600;font-size:.95rem;margin:16px 0 6px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;height:120px}

dialog{border:0;border-radius:20px;padding:0;max-width:620px;width:calc(100% - 28px);max-height:min(78vh,720px);background:var(--surface);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,12,20,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;position:sticky;top:0;background:var(--surface)}
.dh h3{margin:0;font-family:var(--serif)}
.db{padding:0 18px 18px}
.unit{padding:10px 0;border-top:1px solid var(--line)}
.unit .r{font-size:.8rem;color:var(--muted)}
.tips{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:10px 14px;margin:12px 0}
.tips ol{margin:8px 0 2px;padding-left:1.2em;font-size:.93rem;color:var(--ink-2)}
.tips li{margin:6px 0}
.stepbox{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:14px 14px;margin-top:10px}
.stepbox .sn{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:.85rem;font-weight:600}
.artlist{display:grid;gap:8px;max-height:46vh;overflow:auto;padding:2px}
.art{border-radius:12px;padding:10px 12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.art.sel{box-shadow:inset 0 0 0 2px var(--value);background:var(--value-soft)}
.art.clue{box-shadow:inset 0 0 0 2px var(--green)}
.art .r{font-size:.8rem;color:var(--muted)}
.art .cl{color:var(--green);font-weight:600}
.art .quote{white-space:pre-line}
.tk{cursor:pointer;border-radius:4px;padding:1px 0}
.tk:hover{background:var(--line)}
.tk.on{background:#FFE7A0;color:#151A2C}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.methods button{border:0;border-radius:12px;padding:11px 8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font-size:.93rem}
.methods button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.checks{list-style:none;margin:10px 0 0;padding:0;font-size:.88rem;color:var(--muted);display:grid;gap:2px}
.checks li.ok{color:var(--green)}
.mynote{border-radius:12px;padding:12px 14px;background:var(--value-soft);font-size:.93rem;margin:12px 0}
.mynote b{display:block;font-size:.8rem;color:var(--value);margin-bottom:2px}
.badge{font-size:.75rem;font-weight:600;color:var(--value);margin-left:6px}
.selflist{display:grid;gap:10px;margin-top:6px}
.selfrow{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px}
.selfrow p{margin:0 0 8px;font-size:.98rem}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lv button{border:0;border-radius:10px;padding:9px 4px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font-weight:600}
.lv button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.mycon{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--serif);font-size:1.15rem}
.mycon input{flex:1;min-width:160px;font-family:var(--serif);font-size:1.15rem}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lk button{border:0;border-radius:10px;padding:8px 2px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.lk button b{font-size:1.05rem}
.lk button span{font-size:.68rem;color:var(--muted);line-height:1.2;text-align:center}
.lk button[aria-checked="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.lk button[aria-checked="true"] span{color:var(--surface)}
.ex{border-top:1px solid var(--line);padding:10px 0 4px}
.ex .tag{display:inline-block;font-size:.72rem;font-weight:600;border-radius:5px;padding:0 6px;background:var(--value-soft);color:var(--value);margin-right:4px}
.idcard{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:16px 16px 12px;margin-top:6px}
.idcard .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.code6{font-size:1.6rem;letter-spacing:.35em;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{font-size:.85rem;color:var(--muted)}
.kv dd{margin:0}
.guide{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 6px;font-size:.95rem;color:var(--ink-2)}
.gstep{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:.78rem;font-weight:600}
.guide .left{margin-left:auto;font-size:.88rem}
.vchips{gap:8px}
.vchip{border:0;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.95rem;background:var(--surface)}
.vchip.todo{box-shadow:inset 0 0 0 1.5px var(--value);color:var(--value);animation:nudge 2.4s ease-in-out infinite}
.vchip.done{box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.vchip.on{background:var(--value);color:var(--surface);box-shadow:none;animation:none}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.vchip.todo{animation:none}}
.term{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted var(--value);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}
.gloss{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:.85rem;padding:6px 8px;border-radius:8px;white-space:nowrap}
.gloss:hover{background:var(--line)}
.crit{border-radius:12px;padding:10px 12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);margin-top:8px}
.crit .cn{font-weight:600}
.crit .ca{font-size:.85rem;color:var(--muted);margin:2px 0 6px}
.judge{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.judge button{border:0;border-radius:9px;padding:8px 4px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font-size:.88rem}
.judge button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.mode{display:inline-flex;background:var(--surface);border-radius:12px;padding:4px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px}
.mode button{border:0;background:none;border-radius:9px;padding:8px 16px;cursor:pointer;color:var(--ink-2)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.orig{font-size:.85rem;margin-left:8px;white-space:nowrap}
[hidden]{display:none!important}
@media (min-width:640px){ .tiles{grid-template-columns:repeat(2,1fr)} }
@media (max-width:420px){ .app{padding:12px 14px 16px} .stance{grid-template-columns:1fr} .kv{grid-template-columns:1fr} }
</style>
<style>
.portal-nav{position:relative;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.7rem;background:#17354a;padding:.7rem max(1rem,calc((100% - 1120px)/2));font:600 .95rem system-ui,sans-serif}
.portal-nav div{display:flex;gap:1rem}.portal-nav a{color:white;text-decoration:underline;text-underline-offset:.2em}
[hidden]{display:none!important}
.storage-alert{position:sticky;bottom:0;z-index:100;background:#ffe3a0;color:#332300;padding:.75rem;text-align:center}
@media(max-width:650px){.portal-nav{padding:.65rem 1rem}}
</style></head>
<body><nav class="portal-nav" aria-label="웹앱 메뉴"><a href="index.html">헌법 가치 탐구</a><div><a href="student.html">학생용</a><a href="teacher.html">교사용</a></div></nav><form id="login" class="box" style="max-width:28rem;margin:2rem auto;padding:1rem"><h1>학생 로그인</h1><label>학급 코드<input name="room" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric"></label><label>학번<input name="sid" required pattern="[0-9]{5}" maxlength="5" inputmode="numeric"></label><label>등록 이메일<input type="email" name="email" required autocomplete="username"></label><label>비밀번호<input type="password" name="password" required autocomplete="current-password"></label><button class="btn">로그인</button><output role="status"></output></form><div id="app" hidden><button id="logout" class="btn ghost">로그아웃</button><div class="storage-alert" role="alert" id="storageAlert" hidden></div>
<div class="app">
  <div class="top"><button class="back" id="back" aria-label="이전 단계">← 이전</button><div class="bar"><i id="prog"></i></div><span class="stepno" id="stepno"></span><button class="gloss" id="glossBtn" aria-label="용어 사전">📖 용어</button></div>
  <main id="main" aria-live="polite"></main>
  <div class="foot">제작: 인천광역시교육청 오희찬</div>
</div>

const DATA = {"chapters":["전문","제1장 총강","제2장 국민의 권리와 의무","제3장 국회","제4장 정부","제5장 법원","제6장 헌법재판소","제7장 선거관리","제8장 지방자치","제9장 경제","제10장 헌법개정"],"units":[{"c":0,"a":0,"p":"","t":"유구한 역사와 전통에 빛나는 우리 대한국민은 3·1운동으로 건립된 대한민국임시정부의 법통과 불의에 항거한 4·19민주이념을 계승하고, 조국의 민주개혁과 평화적 통일의 사명에 입각하여 정의·인도와 동포애로써 민족의 단결을 공고히 하고, 모든 사회적 폐습과 불의를 타파하며, 자율과 조화를 바탕으로 자유민주적 기본질서를 더욱 확고히 하여 정치·경제·사회·문화의 모든 영역에 있어서 각인의 기회를 균등히 하고, 능력을 최고도로 발휘하게 하며, 자유와 권리에 따르는 책임과 의무를 완수하게 하여, 안으로는 국민생활의 균등한 향상을 기하고 밖으로는 항구적인 세계평화와 인류공영에 이바지함으로써 우리들과 우리들의 자손의 안전과 자유와 행복을 영원히 확보할 것을 다짐하면서 1948년 7월 12일에 제정되고 8차에 걸쳐 개정된 헌법을 이제 국회의 의결을 거쳐 국민투표에 의하여 개정한다.","n":["역사","전통","대한","국민","운동","건립","대한민국","임시","정부","법통","불의","항거","민주","이념","계승","조국","민주","개혁","평화","통일","사명","입각","정의","인도","동포애","민족","단결","사회","폐습","불의","타파","자율","조화","바탕","자유","민주","기본질서","정치","경제","사회","문화","영역","기회","균등","능력","고도","발휘","자유","권리","책임","의무","완수","국민","생활","균등","향상","세계평화","인류","공영","이바지","자손","안전","자유","행복","확보","다짐","제정","개정","헌법","국회","의결","국민투표","개정"]},{"c":1,"a":1,"p":"①","t":"대한민국은 민주공화국이다.","n":["대한민국","민주공화국"]},{"c":1,"a":1,"p":"②","t":"대한민국의 주권은 국민에게 있고, 모든 권력은 국민으로부터 나온다.","n":["대한민국","주권","국민","권력","국민"]},{"c":1,"a":2,"p":"①","t":"대한민국의 국민이 되는 요건은 법률로 정한다.","n":["대한민국","국민","요건","법률"]},{"c":1,"a":2,"p":"②","t":"국가는 법률이 정하는 바에 의하여 재외국민을 보호할 의무를 진다.","n":["국가","법률","재외국민","보호","의무"]},{"c":1,"a":3,"p":"","t":"대한민국의 영토는 한반도와 그 부속도서로 한다.","n":["대한민국","영토","한반도","부속","도서"]},{"c":1,"a":4,"p":"","t":"대한민국은 통일을 지향하며, 자유민주적 기본질서에 입각한 평화적 통일정책을 수립하고 이를 추진한다.","n":["대한민국","통일","지향","자유","민주","기본질서","입각","평화","통일","정책","수립","추진"]},{"c":1,"a":5,"p":"①","t":"대한민국은 국제평화의 유지에 노력하고 침략적 전쟁을 부인한다.","n":["대한민국","국제평화","유지","노력","침략","전쟁","부인"]},{"c":1,"a":5,"p":"②","t":"국군은 국가의 안전보장과 국토방위의 신성한 의무를 수행함을 사명으로 하며, 그 정치적 중립성은 준수된다.","n":["국군","국가","안전","보장","국토","방위","신성","의무","수행","사명","정치","중립","준수"]},{"c":1,"a":6,"p":"①","t":"헌법에 의하여 체결·공포된 조약과 일반적으로 승인된 국제법규는 국내법과 같은 효력을 가진다.","n":["헌법","체결","공포","조약","일반","승인","국제법규","국내법","효력"]},{"c":1,"a":6,"p":"②","t":"외국인은 국제법과 조약이 정하는 바에 의하여 그 지위가 보장된다.","n":["외국인","국제법","조약","지위","보장"]},{"c":1,"a":7,"p":"①","t":"공무원은 국민전체에 대한 봉사자이며, 국민에 대하여 책임을 진다.","n":["공무원","국민","전체","봉사자","국민","책임"]},{"c":1,"a":7,"p":"②","t":"공무원의 신분과 정치적 중립성은 법률이 정하는 바에 의하여 보장된다.","n":["공무원","신분","정치","중립","법률","보장"]},{"c":1,"a":8,"p":"①","t":"정당의 설립은 자유이며, 복수정당제는 보장된다.","n":["정당","설립","자유","복수정당제","보장"]},{"c":1,"a":8,"p":"②","t":"정당은 그 목적·조직과 활동이 민주적이어야 하며, 국민의 정치적 의사형성에 참여하는데 필요한 조직을 가져야한다.","n":["정당","조직","활동","민주","국민","정치","의사","형성","참여","조직"]},{"c":1,"a":8,"p":"③","t":"정당은 법률이 정하는 바에 의하여 국가의 보호를 받으며, 국가는 법률이 정하는 바에 의하여 정당운영에 필요한 자금을 보조할 수 있다.","n":["정당","법률","국가","보호","국가","법률","정당","운영","자금","보조"]},{"c":1,"a":8,"p":"④","t":"정당의 목적이나 활동이 민주적 기본질서에 위배될 때에는 정부는 헌법재판소에 그 해산을 제소할 수 있고, 정당은 헌법재판소의 심판에 의하여 해산된다.","n":["정당","활동","민주","기본질서","위배","정부","헌법재판소","해산","제소","정당","헌법재판소","심판","해산"]},{"c":1,"a":9,"p":"","t":"국가는 전통문화의 계승·발전과 민족문화의 창달에 노력하여야 한다.","n":["국가","전통문화","계승","발전","민족","문화","창달","노력"]},{"c":2,"a":10,"p":"","t":"모든 국민은 인간으로서의 존엄과 가치를 가지며, 행복을 추구할 권리를 가진다. 국가는 개인이 가지는 불가침의 기본적 인권을 확인하고 이를 보장할 의무를 진다.","n":["국민","인간","존엄","가치","행복","추구","권리","국가","개인","불가침","기본","인권","확인","보장","의무"]},{"c":2,"a":11,"p":"①","t":"모든 국민은 법 앞에 평등하다. 누구든지 성별·종교 또는 사회적 신분에 의하여 정치적·경제적·사회적·문화적 생활의 모든 영역에 있어서 차별을 받지 아니한다.","n":["국민","평등","성별","종교","사회","신분","정치","경제","사회","문화","생활","영역","차별"]},{"c":2,"a":11,"p":"②","t":"사회적 특수계급의 제도는 인정되지 아니하며, 어떠한 형태로도 이를 창설할 수 없다.","n":["사회","특수","계급","제도","인정","형태","창설"]},{"c":2,"a":11,"p":"③","t":"훈장등의 영전은 이를 받은 자에게만 효력이 있고, 어떠한 특권도 이에 따르지 아니한다.","n":["훈장","영전","효력","특권"]},{"c":2,"a":12,"p":"①","t":"모든 국민은 신체의 자유를 가진다. 누구든지 법률에 의하지 아니하고는 체포·구속·압수·수색 또는 심문을 받지 아니하며, 법률과 적법한 절차에 의하지 아니하고는 처벌·보안처분 또는 강제노역을 받지 아니한다.","n":["국민","신체","자유","법률","체포","구속","압수","수색","심문","법률","적법","절차","처벌","보안처분","강제","노역"]},{"c":2,"a":12,"p":"②","t":"모든 국민은 고문을 받지 아니하며, 형사상 자기에게 불리한 진술을 강요당하지 아니한다.","n":["국민","고문","형사","불리","진술","강요"]},{"c":2,"a":12,"p":"③","t":"체포·구속·압수 또는 수색을 할 때에는 적법한 절차에 따라 검사의 신청에 의하여 법관이 발부한 영장을 제시하여야 한다. 다만, 현행범인인 경우와 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때에는 사후에 영장을 청구할 수 있다.","n":["체포","구속","압수","수색","적법","절차","검사","신청","법관","발부","영장","제시","현행범인","장기","도피","증거","인멸","염려","사후","영장","청구"]},{"c":2,"a":12,"p":"④","t":"누구든지 체포 또는 구속을 당한 때에는 즉시 변호인의 조력을 받을 권리를 가진다. 다만, 형사피고인이 스스로 변호인을 구할 수 없을 때에는 법률이 정하는 바에 의하여 국가가 변호인을 붙인다.","n":["체포","구속","즉시","변호인","조력","권리","형사피고인","변호인","법률","국가","변호인"]},{"c":2,"a":12,"p":"⑤","t":"누구든지 체포 또는 구속의 이유와 변호인의 조력을 받을 권리가 있음을 고지받지 아니하고는 체포 또는 구속을 당하지 아니한다. 체포 또는 구속을 당한 자의 가족등 법률이 정하는 자에게는 그 이유와 일시·장소가 지체없이 통지되어야 한다.","n":["체포","구속","변호인","조력","권리","고지","체포","구속","체포","구속","가족","법률","일시","장소","지체","통지"]},{"c":2,"a":12,"p":"⑥","t":"누구든지 체포 또는 구속을 당한 때에는 적부의 심사를 법원에 청구할 권리를 가진다.","n":["체포","구속","심사","법원","청구","권리"]},{"c":2,"a":12,"p":"⑦","t":"피고인의 자백이 고문·폭행·협박·구속의 부당한 장기화 또는 기망 기타의 방법에 의하여 자의로 진술된 것이 아니라고 인정될 때 또는 정식재판에 있어서 피고인의 자백이 그에게 불리한 유일한 증거일 때에는 이를 유죄의 증거로 삼거나 이를 이유로 처벌할 수 없다.","n":["피고인","자백","고문","폭행","협박","구속","부당","장기","자의","진술","인정","정식","재판","피고인","자백","불리","유일","증거","유죄","증거","처벌"]},{"c":2,"a":13,"p":"①","t":"모든 국민은 행위시의 법률에 의하여 범죄를 구성하지 아니하는 행위로 소추되지 아니하며, 동일한 범죄에 대하여 거듭 처벌받지 아니한다.","n":["국민","행위","법률","범죄","구성","행위","소추","동일","범죄","처벌"]},{"c":2,"a":13,"p":"②","t":"모든 국민은 소급입법에 의하여 참정권의 제한을 받거나 재산권을 박탈당하지 아니한다.","n":["국민","소급","입법","참정","제한","재산권","박탈"]},{"c":2,"a":13,"p":"③","t":"모든 국민은 자기의 행위가 아닌 친족의 행위로 인하여 불이익한 처우를 받지 아니한다.","n":["국민","행위","친족","행위","이익","처우"]},{"c":2,"a":14,"p":"","t":"모든 국민은 거주·이전의 자유를 가진다.","n":["국민","거주","자유"]},{"c":2,"a":15,"p":"","t":"모든 국민은 직업선택의 자유를 가진다.","n":["국민","직업","선택","자유"]},{"c":2,"a":16,"p":"","t":"모든 국민은 주거의 자유를 침해받지 아니한다. 주거에 대한 압수나 수색을 할 때에는 검사의 신청에 의하여 법관이 발부한 영장을 제시하여야 한다.","n":["국민","주거","자유","침해","주거","압수","수색","검사","신청","법관","발부","영장","제시"]},{"c":2,"a":17,"p":"","t":"모든 국민은 사생활의 비밀과 자유를 침해받지 아니한다.","n":["국민","사생활","비밀","자유","침해"]},{"c":2,"a":18,"p":"","t":"모든 국민은 통신의 비밀을 침해받지 아니한다.","n":["국민","통신","비밀","침해"]},{"c":2,"a":19,"p":"","t":"모든 국민은 양심의 자유를 가진다.","n":["국민","양심","자유"]},{"c":2,"a":20,"p":"①","t":"모든 국민은 종교의 자유를 가진다.","n":["국민","종교","자유"]},{"c":2,"a":20,"p":"②","t":"국교는 인정되지 아니하며, 종교와 정치는 분리된다.","n":["국교","인정","종교","정치","분리"]},{"c":2,"a":21,"p":"①","t":"모든 국민은 언론·출판의 자유와 집회·결사의 자유를 가진다.","n":["국민","언론","출판","자유","집회","결사","자유"]},{"c":2,"a":21,"p":"②","t":"언론·출판에 대한 허가나 검열과 집회·결사에 대한 허가는 인정되지 아니한다.","n":["언론","출판","허가","검열","집회","결사","허가","인정"]},{"c":2,"a":21,"p":"③","t":"통신·방송의 시설기준과 신문의 기능을 보장하기 위하여 필요한 사항은 법률로 정한다.","n":["통신","방송","시설","기준","신문","기능","보장","법률"]},{"c":2,"a":21,"p":"④","t":"언론·출판은 타인의 명예나 권리 또는 공중도덕이나 사회윤리를 침해하여서는 아니된다. 언론·출판이 타인의 명예나 권리를 침해한 때에는 피해자는 이에 대한 피해의 배상을 청구할 수 있다.","n":["언론","출판","타인","명예","권리","공중도덕","사회","윤리","침해","언론","출판","타인","명예","권리","침해","피해자","피해","배상","청구"]},{"c":2,"a":22,"p":"①","t":"모든 국민은 학문과 예술의 자유를 가진다.","n":["국민","학문","예술","자유"]},{"c":2,"a":22,"p":"②","t":"저작자·발명가·과학기술자와 예술가의 권리는 법률로써 보호한다.","n":["저작","발명가","과학","기술자","예술가","권리","법률","보호"]},{"c":2,"a":23,"p":"①","t":"모든 국민의 재산권은 보장된다. 그 내용과 한계는 법률로 정한다.","n":["국민","재산권","보장","한계","법률"]},{"c":2,"a":23,"p":"②","t":"재산권의 행사는 공공복리에 적합하도록 하여야 한다.","n":["재산권","행사","공공복리","적합"]},{"c":2,"a":23,"p":"③","t":"공공필요에 의한 재산권의 수용·사용 또는 제한 및 그에 대한 보상은 법률로써 하되, 정당한 보상을 지급하여야한다.","n":["공공필요","재산권","수용","사용","제한","보상","법률","보상","지급"]},{"c":2,"a":24,"p":"","t":"모든 국민은 법률이 정하는 바에 의하여 선거권을 가진다.","n":["국민","법률","선거권"]},{"c":2,"a":25,"p":"","t":"모든 국민은 법률이 정하는 바에 의하여 공무담임권을 가진다.","n":["국민","법률","공무담임권"]},{"c":2,"a":26,"p":"①","t":"모든 국민은 법률이 정하는 바에 의하여 국가기관에 문서로 청원할 권리를 가진다.","n":["국민","법률","국가","기관","문서","청원","권리"]},{"c":2,"a":26,"p":"②","t":"국가는 청원에 대하여 심사할 의무를 진다.","n":["국가","청원","심사","의무"]},{"c":2,"a":27,"p":"①","t":"모든 국민은 헌법과 법률이 정한 법관에 의하여 법률에 의한 재판을 받을 권리를 가진다.","n":["국민","헌법","법률","법관","법률","재판","권리"]},{"c":2,"a":27,"p":"②","t":"군인 또는 군무원이 아닌 국민은 대한민국의 영역 안에서는 중대한 군사상 기밀·초병·초소·유독음식물공급 ·포로·군용물에 관한 죄중 법률이 정한 경우와 비상계엄이 선포된 경우를 제외하고는 군사법원의 재판을 받지 아니한다.","n":["군인","군무원","국민","대한민국","영역","중대","군사","기밀","초병","초소","유독","음식물","공급","포로", ,"t":"국회의원은 청렴의 의무가 있다.","n":["국회의원","청렴","의무"]},{"c":3,"a":46,"p":"②","t":"국회의원은 국가이익을 우선하여 양심에 따라 직무를 행한다.","n":["국회의원","국가","이익","우선","양심","직무"]},{"c":3,"a":46,"p":"③","t":"국회의원은 그 지위를 남용하여 국가·공공단체 또는 기업체와의 계약이나 그 처분에 의하여 재산상의 권리·이익 또는 직위를 취득하거나 타인을 위하여 그 취득을 알선할 수 없다.","n":["국회의원","지위","남용","국가","공공","단체","기업체","계약","처분","재산","권리","이익","직위","취득","타인","취득","알선"]},{"c":3,"a":47,"p":"①","t":"국회의 정기회는 법률이 정하는 바에 의하여 매년 1회 집회되며, 국회의 임시회는 대통령 또는 국회재적의원 4분의 1 이상의 요구에 의하여 집회된다.","n":["국회","정기","법률","집회","국회","임시회","대통령","국회","재적의원","요구","집회"]},{"c":3,"a":47,"p":"②","t":"정기회의 회기는 100일을, 임시회의 회기는 30일을 초과할 수 없다.","n":["정기","회의","회기","임시회","회기","초과"]},{"c":3,"a":47,"p":"③","t":"대통령이 임시회의 집회를 요구할 때에는 기간과 집회요구의 이유를 명시하여야 한다.","n":["대통령","임시","회의","집회","요구","집회","요구","명시"]},{"c":3,"a":48,"p":"","t":"국회는 의장 1인과 부의장 2인을 선출한다.","n":["국회","의장","부의장","선출"]},{"c":3,"a":49,"p":"","t":"국회는 헌법 또는 법률에 특별한 규정이 없는 한 재적의원 과반수의 출석과 출석의원 과반수의 찬성으로 의결한다. 가부동수인 때에는 부결된 것으로 본다.","n":["국회","헌법","법률","특별","재적의원","과반수","출석","출석의원","과반수","찬성","의결","가부","동수","부결"]},{"c":3,"a":50,"p":"①","t":"국회의 회의는 공개한다. 다만, 출석의원 과반수의 찬성이 있거나 의장이 국가의 안전보장을 위하여 필요하다고 인정할 때에는 공개하지 아니할 수 있다.","n":["국회","회의","공개","출석의원","과반수","찬성","의장","국가","안전","보장","인정","공개"]},{"c":3,"a":50,"p":"②","t":"공개하지 아니한 회의내용의 공표에 관하여는 법률이 정하는 바에 의한다.","n":["공개","회의","공표","법률"]},{"c":3,"a":51,"p":"","t":"국회에 제출된 법률안 기타의 의안은 회기 중에 의결되지 못한 이유로 폐기되지 아니한다. 다만, 국회의원의 임기가 만료된 때에는 그러하지 아니하다.","n":["국회","제출","법률안","의안","회기","의결","폐기","국회의원","임기","만료"]},{"c":3,"a":52,"p":"","t":"국회의원과 정부는 법률안을 제출할 수 있다.","n":["국회의원","정부","법률안","제출"]},{"c":3,"a":53,"p":"①","t":"국회에서 의결된 법률안은 정부에 이송되어 15일 이내에 대통령이 공포한다.","n":["국회","의결","법률안","정부","이송","이내","대통령","공포"]},{"c":3,"a":53,"p":"②","t":"법률안에 이의가 있을 때에는 대통령은 제1항의 기간내에 이의서를 붙여 국회로 환부하고, 그 재의를 요구할 수 있다. 국회의 폐회 중에도 또한 같다.","n":["법률안","이의","대통령","이의","국회","환부","재의","요구","국회","폐회"]},{"c":3,"a":53,"p":"③","t":"대통령은 법률안의 일부에 대하여 또는 법률안을 수정하여 재의를 요구할 수 없다.","n":["대통령","법률안","일부","법률안","수정","재의","요구"]},{"c":3,"a":53,"p":"④","t":"재의의 요구가 있을 때에는 국회는 재의에 붙이고, 재적의원 과반수의 출석과 출석의원 3분의 2 이상의 찬성으로 전과 같은 의결을 하면 그 법률안은 법률로서 확정된다.","n":["재의","요구","국회","재의","재적의원","과반수","출석","출석의원","찬성","의결","법률안","법률","확정"]},{"c":3,"a":53,"p":"⑤","t":"대통령이 제1항의 기간 내에 공포나 재의의 요구를 하지 아니한 때에도 그 법률안은 법률로서 확정된다.","n":["대통령","공포","재의","요구","법률안","법률","확정"]},{"c":3,"a":53,"p":"⑥","t":"대통령은 제4항과 제5항의 규정에 의하여 확정된 법률을 지체없이 공포하여야 한다. 제5항에 의하여 법률이 확정된 후 또는 제4항에 의한 확정법률이 정부에 이송된 후 5일 이내에 대통령이 공포하지 아니할 때에는 국회의장이 이를 공포한다.","n":["대통령","확정","법률","지체","공포","법률","확정","확정","법률","정부","이송","이내","대통령","공포","국회의장","공포"]},{"c":3,"a":53,"p":"⑦","t":"법률은 특별한 규정이 없는 한 공포한 날로부터 20일을 경과함으로써 효력을 발생한다.","n":["법률","특별","공포","경과","효력","발생"]},{"c":3,"a":54,"p":"①","t":"국회는 국가의 예산안을 심의·확정한다.","n":["국회","국가","예산안","심의","확정"]},{"c":3,"a":54,"p":"②","t":"정부는 회계연도마다 예산안을 편성하여 회계연도 개시 90일 전까지 국회에 제출하고, 국회는 회계연도 개시 30일 전까지 이를 의결하여야 한다.","n":["정부","회계","연도","예산안","편성","회계","연도","개시","국회","제출","국회","회계","연도","개시","의결"]},{"c":3,"a":54,"p":"③","t":"새로운 회계연도가 개시될 때까지 예산안이 의결되지 못한 때에는 정부는 국회에서 예산안이 의결될 때까지 다음의 목적을 위한 경비는 전년도 예산에 준하여 집행할 수 있다.\n1. 헌법이나 법률에 의하여 설치된 기관 또는 시설의 유지·운영\n2. 법률상 지출의무의 이행\n3. 이미 예산으로 승인된 사업의 계속","n":["회계","연도","개시","예산안","의결","정부","국회","예산안","의결","경비","전년도","예산","집행","헌법","법률","설치","기관","시설","유지","운영","법률","지출","의무","이행","예산","승인","사업"]},{"c":3,"a":55,"p":"①","t":"한 회계연도를 넘어 계속하여 지출할 필요가 있을 때에는 정부는 연한을 정하여 계속비로서 국회의 의결을 얻어야 한다.","n":["회계","연도","계속","지출","정부","연한","계속비","국회","의결"]},{"c":3,"a":55,"p":"②","t":"예비비는 총액으로 국회의 의결을 얻어야 한다. 예비비의 지출은 차기국회의 승인을 얻어야 한다.","n":["예비비","총액","국회","의결","예비비","지출","차기","국회","승인"]},{"c":3,"a":56,"p":"","t":"정부는 예산에 변경을 가할 필요가 있을 때에는 추가경정예산안을 편성하여 국회에 제출할 수 있다.","n":["정부","예산","변경","추가경정예산안","편성","국회","제출"]},{"c":3,"a":57,"p":"","t":"국회는 정부의 동의 없이 정부가 제출한 지출예산 각항의 금액을 증가하거나 새 비목을 설치할 수 없다.","n":["국회","정부","동의","정부","제출","지출","예산","금액","증가","비목","설치"]},{"c":3,"a":58,"p":"","t":"국채를 모집하거나 예산 외에 국가의 부담이 될 계약을 체결하려 할 때에는 정부는 미리 국회의 의결을 얻어야한다.","n":["국채","모집","예산","국가","부담","계약","체결","정부","국회","의결"]},{"c":3 대통령","당선자","사망","판결","자격","상실","이내","후임자","선거"]},{"c":4,"a":69,"p":"","t":"대통령은 취임에 즈음하여 다음의 선서를 한다.“나는 헌법을 준수하고 국가를 보위하며 조국의 평화적 통일과 국민의 자유와 복리의 증진 및 민족문화의 창달에 노력하여 대통령으로서의 직책을 성실히 수행할 것을 국민 앞에 엄숙히 선서합니다.”","n":["대통령","취임","선서","헌법","준수","국가","보위","조국","평화","통일","국민","자유","복리","증진","민족","문화","창달","노력","대통령","직책","수행","국민","선서"]},{"c":4,"a":70,"p":"","t":"대통령의 임기는 5년으로 하며, 중임할 수 없다.","n":["대통령","임기","중임"]},{"c":4,"a":71,"p":"","t":"대통령이 궐위되거나 사고로 인하여 직무를 수행할 수 없을 때에는 국무총리, 법률이 정한 국무위원의 순서로 그 권한을 대행한다.","n":["대통령","궐위","사고","직무","수행","국무총리","법률","국무위원","순서","권한","대행"]},{"c":4,"a":72,"p":"","t":"대통령은 필요하다고 인정할 때에는 외교·국방·통일 기타 국가안위에 관한 중요정책을 국민투표에 붙일 수 있다.","n":["대통령","인정","외교","국방","통일","국가","안위","중요","정책","국민투표"]},{"c":4,"a":73,"p":"","t":"대통령은 조약을 체결·비준하고, 외교사절을 신임·접수 또는 파견하며, 선전포고와 강화를 한다.","n":["대통령","조약","체결","비준","외교","사절","신임","접수","파견","선전","포고","강화"]},{"c":4,"a":74,"p":"①","t":"대통령은 헌법과 법률이 정하는 바에 의하여 국군을 통수한다.","n":["대통령","헌법","법률","통수"]},{"c":4,"a":74,"p":"②","t":"국군의 조직과 편성은 법률로 정한다.","n":["국군","조직","편성","법률"]},{"c":4,"a":75,"p":"","t":"대통령은 법률에서 구체적으로 범위를 정하여 위임받은 사항과 법률을 집행하기 위하여 필요한 사항에 관하여 대통령령을 발할 수 있다.","n":["대통령","법률","구체","위임","법률","집행","대통령령"]},{"c":4,"a":76,"p":"①","t":"대통령은 내우·외환·천재·지변 또는 중대한 재정·경제상의 위기에 있어서 국가의 안전보장 또는 공공의 안녕질서를 유지하기 위하여 긴급한 조치가 필요하고 국회의 집회를 기다릴 여유가 없을 때에 한하여 최소한으로 필요한 재정·경제상의 처분을 하거나 이에 관하여 법률의 효력을 가지는 명령을 발할 수 있다.","n":["대통령","내우","외환","천재","지변","중대","재정","경제","위기","국가","안전","보장","공공","안녕","질서","유지","긴급","조치","국회","집회","여유","최소한","재정","경제","처분","법률","효력","명령"]},{"c":4,"a":76,"p":"②","t":"대통령은 국가의 안위에 관계되는 중대한 교전상태에 있어서 국가를 보위하기 위하여 긴급한 조치가 필요하고 국회의 집회가 불가능한 때에 한하여 법률의 효력을 가지는 명령을 발할 수 있다.","n":["대통령","국가","안위","관계","중대","교전","상태","국가","보위","긴급","조치","국회","집회","가능","법률","효력","명령"]},{"c":4,"a":76,"p":"③","t":"대통령은 제1항과 제2항의 처분 또는 명령을 한 때에는 지체없이 국회에 보고하여 그 승인을 얻어야 한다.","n":["대통령","처분","명령","지체","국회","보고","승인"]},{"c":4,"a":76,"p":"④","t":"제3항의 승인을 얻지 못한 때에는 그 처분 또는 명령은 그때부터 효력을 상실한다. 이 경우 그 명령에 의하여 개정 또는 폐지되었던 법률은 그 명령이 승인을 얻지 못한 const NOTES = {"1:인권": "제10조는 국가가 개인의 ‘불가침의 기본적 인권’을 확인하고 보장할 의무를 진다고 밝혀, 인권을 국가가 만들어 주는 것이 아니라 국가보다 앞서 있는 것으로 봅니다.", "1:민주주의": "전문의 ‘4·19민주이념’, ‘자유민주적 기본질서’와 제1조의 ‘민주공화국’은 이 나라를 움직이는 원리가 민주주의임을 밝힙니다.", "1:자유": "전문은 ‘자유와 행복을 영원히 확보’하겠다고 다짐하고, 제10조의 행복추구권은 스스로 삶의 방향을 정할 자유를 전제합니다.", "1:정의": "전문의 ‘정의·인도와 동포애로써’, ‘모든 사회적 폐습과 불의를 타파’는 정의를 국가 공동체의 출발점으로 삼는다는 뜻입니다.", "2:국민": "제1조 제2항은 주권이 국민에게 있다고 하고, 제2조는 국민이 되는 요건과 재외국민 보호를 정해 국민이 국가의 바탕임을 보여 줍니다.", "2:국가": "제1조~제3조는 국가의 형태(민주공화국), 구성원(국민), 영역(한반도와 부속도서)을 차례로 정합니다.", "2:애국심": "낱말은 없지만, 제39조 국방의 의무와 제69조 대통령 취임 선서의 ‘국가를 보위하며’는 공동체를 지키려는 마음을 의무와 책임으로 담고 있습니다.", "2:책임": "전문은 ‘자유와 권리에 따르는 책임과 의무를 완수’하자고 하고, 제7조 제1항은 공무원이 국민에 대하여 책임을 진다고 정합니다.", "2:다양성": "제8조 제1항의 복수정당제, 제11조의 차별 금지, 제20조의 종교의 자유는 서로 다른 생각과 삶의 방식이 함께 있는 사회를 전제합니다.", "2:민주주의": "제1조의 ‘민주공화국’에 더해, 제119조 제2항은 ‘경제의 민주화’를 위해 국가가 경제를 조정할 수 있다고 정해 민주주의를 경제 영역까지 넓힙니다.", "2:시장경제": "제119조 제1항은 ‘개인과 기업의 경제상의 자유와 창의를 존중함을 기본’으로 한다고 밝히고, 제2항은 균형을 위해 국가가 규제·조정할 수 있다고 정합니다.", "3:인간존엄": "제10조 첫 문장 ‘모든 국민은 인간으로서의 존엄과 가치를 가지며’는 모든 기본권의 출발점이 됩니다.", "3:행복": "제10조의 행복추구권은 무엇이 행복인지를 각자가 정하고 추구할 수 있도록 보장합니다.", "3:평등": "제11조 제1항 ‘법 앞에 평등’과 차별 금지, 제2항의 사회적 특수계급 부정이 평등을 직접 밝힙니다.", "3:공정": "낱말은 없지만, 제11조 제1항이 성별·종교·사회적 신분에 따른 차별을 금지하고 제119조 제2항이 ‘적정한 소득의 분배’를 말하는 데서 공정한 기회와 분배를 읽을 수 있습니다.", "4:기본권 보장": "제12조~제36조는 신체의 자유부터 보건까지 개별 권리를 하나하나 보장합니다. 제10조는 ‘기본적 인권’ 보장 의무를, 제37조 제1항은 헌법에 열거되지 않은 자유와 권리도 경시되지 않는다고 밝힙니다.", "5:공공복리": "제23조 제2항 ‘재산권의 행사는 공공복리에 적합하도록’과 제37조 제2항은 개인의 권리가 공동체의 이익과 조화를 이루어야 함을 보여 줍니다.", "5:협동": "전문의 ‘동포애로써 민족의 단결을 공고히’와 제123조 제5항의 자조조직 육성은 서로 힘을 모으는 공동체를 그립니다.", "5:관용": "제19조 양심의 자유, 제20조 종교의 자유, 제21조 표현의 자유는 나와 다른 생각을 가진 사람의 자유도 인정해야 한다는 관용을 전제합니다.", "5:책임과 의무": "제38조 납세의 의무, 제39조 국방의 의무, 제35조 제1항의 ‘국가와 국민은 환경보전을 위하여 노력하여야 한다’가 공동체 구성원의 책임을 정합니다.", "6:국민주권": "제1조 제2항 ‘대한민국의 주권은 국민에게 있고, 모든 권력은 국민으로부터 나온다’가 국민주권을 직접 밝힙니다.", "6:선거": "제24조 선거권과 제41조·제67조의 보통·평등·직접·비밀선거는 국민이 주권을 행사하는 대표적인 방법입니다.", "6:정당": "제8조는 정당 설립의 자유와 복수정당제를 보장하면서, 정당의 목적·조직·활동이 민주적이어야 한다고 정합니다.", "6:대화와 토론": "제21조 표현·집회의 자유, 제50조 국회 회의 공개, 제8조 제2항의 ‘국민의 정치적 의사형성에 참여’는 공개된 대화와 토론으로 결정하는 민주주의를 담고 있습니다.", "6:민주주의": "제8조 제2항의 ‘민주적’, 제4항의 ‘민주적 기본질서’는 정당과 정치 과정이 민주주의 원리를 따라야 함을 밝힙니다.", "6:권력의 제한": "제65조 탄핵소추와 제77조 제5항의 국회의 계엄 해제 요구는 대통령 같은 최고 권력도 헌법의 통제를 받는다는 것을 제도로 보여 줍니다.", "7:민주주의": "제1조 제1항 ‘대한민국은 민주공화국이다’를 지키기 위한 장치가 권력분립입니다. 권력을 나누어야 국민의 뜻이 한 사람에게 독점되지 않습니다.", "7:법치주의": "제37조 제2항의 ‘법률로써’, 제12조 제1항의 ‘법률과 적법한 절차’, 제103조의 ‘헌법과 법률에 의하여’는 국가 권력이 법에 따라서만 행사되어야 한다는 법치주의를 담고 있습니다.", "7:권력통제": "입법권은 국회(제40조), 행정권은 정부(제66조 제4항), 사법권은 법원(제101조 제1항)에 나눈 짜임과, 대통령의 재의 요구(제53조), 국회의 탄핵소추(제65조)가 서로를 견제하게 합니다.", "7:적법절차": "제12조 제1항은 ‘법률과 적법한 절차’ 없이 처벌받지 않는다고 하고, 제3항은 체포·구속에 법관이 발부한 영장을 요구합니다.", "8:참여": "제24조 선거권과 제118조 제2항의 지방의회 의원선거는 주민이 대표를 뽑아 지역의 일에 참여하는 길을 엽니다.", "8:타협": "제49조의 다수결 규칙과 가부동수일 때 부결로 보는 원칙은 서로 다른 의견을 모으는 절차이고, 제119조 제2항은 ‘경제주체간의 조화’를 말합니다.", "8:협동": "제117조 제1항은 지방자치단체가 ‘주민의 복리에 관한 사무’를 스스로 처리하도록 하고, 제123조 제5항은 자조조직 육성을 정해 함께 해결하는 공동체를 담습니다.", "9:정의": "전문의 ‘정의·인도’와 ‘불의를 타파’라는 다짐을 실제로 지키는 장치가 헌법재판입니다. 헌법에 어긋난 법률을 바로잡습니다(제111조).", "9:관용": "제19조 양심의 자유, 제20조 종교의 자유는 서로 다른 신념을 가진 사람이 함께 살아가기 위한 관용을 전제합니다. 헌법재판은 이런 자유가 부딪칠 때 기준을 제시합니다.", "9:사회통합": "전문의 ‘민족의 단결’과 제111조 제1항의 권한쟁의 심판은 국가기관 사이의 다툼까지 헌법에 따라 평화롭게 해결해 사회를 하나로 묶습니다.", "10:정의": "전문의 ‘정의·인도’와 ‘각인의 기회를 균등히’는 기술 발전의 이익과 부담이 공정하게 나뉘어야 한다는 기준이 됩니다.", "10:관용": "제19조~제21조의 양심·종교·표현의 자유는 온라인 공간에서도 다른 의견을 존중해야 한다는 관용의 근거가 됩니다.", "10:다양성": "제8조 제1항 복수정당제, 제11조 차별 금지, 제20조 종교의 자유는 알고리즘과 AI가 한쪽 생각만 키우지 않도록 해야 한다는 기준으로 읽을 수 있습니다.", "10:참여": "제24조 선거권과 제21조 표현·집회의 자유는 디지털 기술에 관한 결정에도 시민이 참여할 수 있어야 한다는 근거가 됩니다.", "10:지속가능": "제35조 제1항 환경권, 제120조 제2항 ‘국토와 자원’의 균형 있는 개발, 제122조 국토의 ‘이용·개발과 보전’은 미래세대까지 생각하는 지속가능성을 담고 있습니다."};
AREAS.forEach(a => a.vals.forEach(v => v.x = NOTES[a.n + ":" + v.t] || ""));

// ---------- 도우미 ----------
const U = DATA.units;
U.forEach(u => u.t = u.t.replace(/\u318d/g, "·"));
const sets = U.map(u => new Set(u.n));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jong = s => { const c = s.charCodeAt(s.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; };
const P = (s, a, b) => s + (jong(s) ? a : b);
const code = u => u.a === 0 ? "0" : `${u.a}${u.p}`;
const label = u => u.a === 0 ? "전문" : `제${u.a}조${u.p ? " " + u.p : ""}`;
const cut = (t, n = 110) => t.length > n ? t.slice(0, n) + "…" : t;
const fmtDate = s => { const [y, m, d] = s.split("-"); return `${y}. ${+m}. ${+d}.`; };
function unitsOf(c) { const m = String(c).match(/^(\d+)([①-⑩]?)$/); return U.filter(u => u.a === +m[1] && (!m[2] || u.p === m[2])); }
function areaUnits(a) { return a.arts.flatMap(unitsOf); }
function highlight(text, words) {
  if (!words.length) return esc(text);
  const re = new RegExp(words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
  return esc(text).replace(re, m => `<mark>${m}</mark>`);
}
// 그 가치가 이 영역 조문에 '쓰여 있는지' (형태소 분석 결과 기준)
function writtenIn(a, v) {
  const us = areaUnits(a);
  const hits = us.filter(u => v.w.some(w => sets[U.indexOf(u)].has(w)));
  return {written: hits.length > 0, units: hits};
}

  ["헌법재판소", "법률이 헌법에 맞는지 등 헌법 문제를 판단하는 기관이에요. 재판관 9명으로 구성돼요(제111조)."],
  ["위헌법률심판", "재판 중에 그 재판에 적용될 법률이 헌법에 맞는지 문제가 되면, 법원이 헌법재판소에 판단을 요청하는 심판이에요(제107조 제1항, 제111조)."],

// 글 속의 용어를 눌러 볼 수 있는 단추로 바꾼다 (같은 용어는 한 글에서 한 번만)
function termify(text) {
  let html = esc(text); const used = new Set();
  for (const k of GKEYS) {
    if (used.has(k) || [...used].some(u => u.includes(k))) continue;
    const i = html.indexOf(esc(k)); if (i < 0) continue;
    if (html.lastIndexOf("<", i) > html.lastIndexOf(">", i)) continue;
    html = html.slice(0, i) + `<button class="term" data-term="${esc(k)}">${esc(k)}</button>` + html.slice(i + esc(k).length);
    used.add(k);
  }
  return html;
}

  document.getElementById("gq").oninput = drawG; drawG(); setTimeout(() => document.getElementById("gq").focus(), 50);
}

      const tw = mctx.measureText(w).width, th = size * 1.05, pad = 4;
      for (let s = 0; s < 3000; s++) {
        const ang = s * .31, r = 1.5 * ang, cx = W / 2 + r * Math.cos(ang) * (W / H) * .85, cy = H / 2 + r * Math.sin(ang);
        const rect = {x: cx - tw / 2 - pad, y: cy - th / 2 - pad, w: tw + pad * 2, h: th + pad * 2};
        if (rect.x < 0 || rect.y < 0 || rect.x + rect.w > W || rect.y + rect.h > H || hit(rect)) continue;
        placed.push(rect); out.push({w, size, wt, x: cx, y: cy + size * .34}); break;
      }
    }
    fitCloud(svg, placed);
    svg.innerHTML = out.map(o => `<text x="${o.x.toFixed(1)}" y="${o.y.toFixed(1)}" text-anchor="middle" font-size="${o.size}" font-weight="${o.wt}" fill="var(${S.found.includes(o.w) ? "--value" : "--faint"})" tabindex="0" role="button" data-w="${esc(o.w)}">${esc(o.w)}</text>`).join("");
    el.querySelector("#dots").innerHTML = targets.map(v => `<i class="${foundVals().includes(v) ? "on" : ""}" title="${foundVals().includes(v) ? esc(v.t) : ""}"></i>`).join("");
  };
  const tap = w => {
    const isTarget = targetWords.has(w);
    if (isTarget && !S.found.includes(w)) { S.found.push(w); save(); }
    draw();
    const hits = us.filter(u => sets[U.indexOf(u)].has(w));
    const v = targets.find(v => v.w.includes(w));
    openDlg(isTarget ? `찾았어요! ‘${v.t}’` : `‘${w}’`, hits.map(u => `<div class="unit"><div class="r">${label(u)}</div><div class="quote">${highlight(u.t, [w])}</div></div>`).join(""));
    if (foundVals().length === targets.length) el.querySelector("#cl").innerHTML = `<b>${targets.length}개를 모두 찾았어요.</b> 나머지 가치는 단어로는 없지만 조문에 담겨 있을지도 몰라요.`;
  };
  svg.addEventListener("click", e => { const t = e.target.closest("text"); if (t) tap(t.dataset.w); });
  svg.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.w) { e.preventDefault(); tap(e.target.dataset.w); } });
  requestAnimationFrame(draw);
  window.onresize = () => { if (STEPS[S.step] === "cloud") draw(); };
  el.querySelector("#n").onclick = () => go(4);
};

function fitCloud(svg, placed) {
  if (!placed.length) return;
  const pad = 6, x0 = Math.min(...placed.map(p => p.x)) - pad, y0 = Math.min(...placed.map(p => p.y)) - pad;
  const w = Math.max(...placed.map(p => p.x + p.w)) + pad - x0, h = Math.max(...placed.map(p => p.y + p.h)) + pad - y0;
  const cw = svg.clientWidth || w, scale = Math.min(1.5, cw / w);
  svg.setAttribute("viewBox", `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  svg.style.height = Math.round(h * scale) + "px";
}
// ---------- 공용: 단어 구름 그리기 ----------
// tf: Map(단어→횟수), opts.color(w): CSS 변수 이름, opts.max: 단어 수, opts.extra: 꼭 넣을 단어
function drawCloudInto(svg, tf, opts) {
  const W = svg.clientWidth || 600, H = opts.h || Math.round(Math.min(300, Math.max(200, W * 0.45)));
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const words = [...tf].sort((x, y) => y[1] - x[1]).slice(0, opts.max || 45);
  (opts.extra || []).forEach(w => { if (tf.has(w) && !words.some(x => x[0] === w)) words.push([w, tf.get(w)]); });
  words.sort((x, y) => y[1] - x[1]);
  if (!words.length) { svg.innerHTML = ""; return; }
  const mx = words[0][1], mn = words[words.length - 1][1];
  const big = Math.min(W < 480 ? 34 : 48, H / 5), small = 13, placed = [], out = [];
  const hit = r => placed.some(p => r.x < p.x + p.w && r.x + r.w > p.x && r.y < p.y + p.h && r.y + r.h > p.y);
  const fam = getComputedStyle(document.body).fontFamily;
  for (const [w, c] of words) {
    const t = Math.sqrt((c - mn) / (mx - mn || 1)), size = Math.round(small + t * (big - small)), wt = t > .45 ? 600 : 500;
    mctx.font = `${wt} ${size}px ${fam}`;
    const tw = mctx.measureText(w).width, th = size * 1.05, pad = 4;
    for (let s = 0; s < 3000; s++) {
      const ang = s * .31, r = 1.4 * ang, cx = W / 2 + r * Math.cos(ang) * (W / H) * .85, cy = H / 2 + r * Math.sin(ang);
      const rect = {x: cx - tw / 2 - pad, y: cy - th / 2 - pad, w: tw + pad * 2, h: th + pad * 2};
      if (rect.x < 0 || rect.y < 0 || rect.x + rect.w > W || rect.y + rect.h > H || hit(rect)) continue;
      placed.push(rect); out.push({w, size, wt, x: cx, y: cy + size * .34}); break;
    }
  }
  fitCloud(svg, placed);
  svg.innerHTML = out.map(o => `<text x="${o.x.toFixed(1)}" y="${o.y.toFixed(1)}" text-anchor="middle" font-size="${o.size}" font-weight="${o.wt}" fill="var(${opts.color(o.w)})" tabindex="0" role="button" data-w="${esc(o.w)}">${esc(o.w)}</text>`).join("");
}
const tfOf = us => { const m = new Map(); us.forEach(u => u.n.forEach(w => m.set(w, (m.get(w) || 0) + 1))); return m; };
const fullUnitHTML = u => `<div class="unit"><div class="r">${label(u)}</div><div class="quote">${esc(u.t)}</div></div>`;
function showAllArticles() { const a = A(); openDlg(`${a.n}. ${a.name} 관련 조문 전체`, areaUnits(a).map(fullUnitHTML).join("")); }

    openDlg("아직 확인하지 않은 가치가 있어요", `<p class="quote" style="font-family:var(--sans)">${rest.map(v => `<b>${esc(v.t)}</b>`).join(", ")} — ${rest.length}개가 남았어요. 하나씩 눌러 구름에서 확인해 보면 다음 단계가 훨씬 쉬워져요.</p>

// ---------- 5단계: 깊이 읽기 (근거 구절 → 담긴 방식 → 설명 → 해석 예시와 비교) ----------
const METHODS = ["낱말로 직접 밝힌다", "권리를 보장한다", "국가의 의무나 금지로 정한다", "제도와 절차로 만든다"];
const TIPS = [
  ["가치가 지켜진 모습을 떠올려요", "‘관용’이 지켜지려면 나와 다른 생각도 말할 수 있어야 해요. 그래서 양심·종교·표현의 자유(제19~21조)에 관용이 담겨 있다고 읽을 수 있어요."],
  ["금지와 의무 표현을 뒤집어 봐요", "‘차별을 받지 아니한다’(제11조)처럼 금지하는 문장은 지키려는 가치(평등, 공정)를 거꾸로 보여 줘요."],
  ["제도의 짜임을 봐요", "입법권은 국회(제40조), 행정권은 정부(제66조), 사법권은 법원(제101조)에 나눈 짜임 자체가 ‘권력통제’를 담고 있어요."],
  ["앞뒤 문장과 함께 읽어요", "같은 낱말도 맥락에 따라 뜻이 달라요. ‘통제’(제126조)는 기업 이야기, ‘참여’(제8조)는 정당 이야기예요."]
];
VIEWS.deep = el => {
  const a = A();
  S.deep = S.deep || [];
  const contained = a.vals.filter(v => !writtenIn(a, v).written);
  if (S._dv === undefined || !a.vals[S._dv]) S._dv = a.vals.indexOf(contained[0] || a.vals[0]);
  const v = a.vals[S._dv];
  let d = S.deep.find(x => x.value === v.t);
  if (!d) { d = {value: v.t, art: null, phrase: [], method: null, expl: "", compared: false}; S.deep.push(d); }
  const written = writtenIn(a, v).written;
  const refCodes = written ? writtenIn(a, v).units.map(code) : (v.r || []).flatMap(c => unitsOf(c).map(code));
  const candCodes = [...new Set([...refCodes, ...areaUnits(a).map(code)])];
  const cands = candCodes.map(c => unitsOf(c)[0]).filter(Boolean);
  // 참고 조문이 맨 앞에 몰리지 않게 조 번호 순으로
  cands.sort((x, y) => x.a - y.a || x.p.localeCompare(y.p));
  el.innerHTML = `<h2>깊이 읽기</h2>

    <div class="chips" id="dv">${a.vals.map((x, k) => `<button class="chip ${k === S._dv ? "on" : ""}" data-k="${k}" style="border:0;cursor:pointer">${esc(x.t)}${writtenIn(a, x).written ? "" : " · 담김"}${S.deep.some(y => y.value === x.t && y.compared) ? " ✓" : ""}</button>`).join("")}</div>
    <details class="tips" ${S._tipSeen ? "" : "open"}><summary>해석 팁 4가지</summary><ol>${TIPS.map(([t, x]) => `<li><b>${t}</b><br>${x}</li>`).join("")}</ol></details>
    <div class="stepbox"><div class="sn">1</div><div><b>구름에서 실마리 찾기</b><p class="hint" style="margin:2px 0 6px">‘${esc(v.t)}’와 이어질 만한 낱말을 누르면, 그 낱말이 들어 있는 조문이 아래에서 표시돼요.</p>
      <svg id="dcloud" style="width:100%;height:200px;display:block" role="img" aria-label="후보 조문의 단어 구름"></svg></div></div>
    <div class="stepbox"><div class="sn">2</div><div style="min-width:0;flex:1"><b>근거 구절 고르기</b><p class="hint" style="margin:2px 0 8px">조문의 어절을 눌러 근거가 되는 구절을 표시하세요. 한 조문 안에서 여러 어절을 고를 수 있어요.</p>
      <div id="arts" class="artlist"></div></div></div>
    <div class="stepbox"><div class="sn">3</div><div style="flex:1"><b>어떤 방식으로 담겨 있나요?</b>
      <div class="methods">${METHODS.map(m => `<button data-m="${m}" aria-pressed="${d.method === m}">${m}</button>`).join("")}</div></div></div>
    <div class="stepbox"><div class="sn">4</div><div style="flex:1"><b>나의 해석 쓰기</b>
      <textarea id="ex" rows="4" placeholder="예: ‘누구든지 성별·종교 또는 사회적 신분에 의하여 … 차별을 받지 아니한다’는 차별을 금지하는 문장이므로, 모두에게 같은 기회를 주는 ‘공정’을 담고 있다.">${esc(d.expl)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn ghost" id="frame" style="padding:10px">문장 틀 넣기</button></div>
      <ul class="checks" id="checks"></ul></div></div>
    <div class="stepbox"><div class="sn">5</div><div style="flex:1"><b>해석 예시와 비교하기</b>
      <div class="row" style="margin-top:6px"><button class="btn ghost" id="cmp" style="padding:10px">해석 예시 보기</button></div><div id="cmpOut"></div></div></div>
    <div class="row"><button class="btn ghost" id="all">관련 조문 전체 보기</button><button class="btn" id="n">필사하러 가기</button></div>`;
  el.querySelector("details.tips").addEventListener("toggle", () => { S._tipSeen = true; save(); });
  const artsBox = el.querySelector("#arts");
  let clue = null;
  const drawArts = () => {
    artsBox.innerHTML = cands.map(u => {
      const c = code(u), sel = d.art === c, toks = u.t.split(/(\s+)/);
      let k = -1;
      const body = toks.map(t => { if (/^\s+$/.test(t)) return t.includes("\n") ? "\n" : " "; k++; return `<span class="tk ${sel && d.phrase.includes(k) ? "on" : ""}" data-k="${k}">${esc(t)}</span>`; }).join("");
      const clueHit = clue && sets[U.indexOf(u)].has(clue);
      return `<div class="art ${sel ? "sel" : ""} ${clueHit ? "clue" : ""}" data-c="${c}"><div class="r">${label(u)}${clueHit ? ` <span class="cl">‘${esc(clue)}’ 있음</span>` : ""}</div><div class="quote">${body}</div></div>`;
    }).join("");
  };
  artsBox.addEventListener("click", e => {
    const t = e.target.closest(".tk"); if (!t) return;
    const c = t.closest(".art").dataset.c, k = +t.dataset.k;
    if (d.art !== c) { d.art = c; d.phrase = []; }
    d.phrase = d.phrase.includes(k) ? d.phrase.filter(x => x !== k) : [...d.phrase, k].sort((x, y) => x - y);
    if (!d.phrase.length) d.art = null;
    save(); drawArts(); checks();
  });
  const dsvg = el.querySelector("#dcloud"), dtf = tfOf(cands);
  const drawD = () => drawCloudInto(dsvg, dtf, {max: 40, color: w => w === clue ? "--value" : "--faint"});
  dsvg.addEventListener("click", e => {
    const t = e.target.closest("text"); if (!t) return; clue = clue === t.dataset.w ? null : t.dataset.w; drawD(); drawArts();

  });

  const phraseText = () => { if (!d.art) return ""; const u = unitsOf(d.art)[0]; const w = u.t.split(/\s+/); return d.phrase.map(k => w[k]).join(" "); };
  el.querySelector("#frame").onclick = () => {
    const ta = el.querySelector("#ex");
    ta.value = `‘${phraseText() || "근거 구절"}’는 ${d.art ? label(unitsOf(d.art)[0]) + "의 내용으로, " : ""}(무엇을 하도록 / 하지 못하도록) 하므로 ‘${v.t}’를 담고 있다.`;
    d.expl = ta.value; save(); checks(); ta.focus();
  };
  el.querySelector("#ex").oninput = e => { d.expl = e.target.value; save(); checks(); };
  // 자동 점검: AI가 아니라 규칙으로 바로 확인한다
  function checks() {
    const ex = (d.expl || "").replace(/\s/g, ""), ph = phraseText().split(" ").filter(w => w.length >= 2);
    const items = [
      [!!d.art && d.phrase.length > 0, "근거 구절을 골랐어요"],
      [!!d.method, "담긴 방식을 골랐어요"],
      [ex.includes(v.t.replace(/\s/g, "")) || v.t.split(" ").some(w => ex.includes(w)), `설명에 ‘${v.t}’가 들어 있어요`],
      [ph.some(w => ex.includes(w.replace(/[,.·]/g, "").slice(0, 3))), "설명에 근거 구절이 들어 있어요"],
      [/(므로|때문|따라서|그래서|라는점|이유)/.test(ex), "‘~므로’, ‘~때문에’처럼 이유로 이어 주었어요"],
      [ex.length >= 40, "40자 이상 썼어요"]
    ];
    el.querySelector("#checks").innerHTML = items.map(([ok, t]) => `<li class="${ok ? "ok" : ""}">${ok ? "●" : "○"} ${t}</li>`).join("");
    el.querySelector("#cmp").disabled = ex.length < 15;
    d.score = items.filter(x => x[0]).length;
  }
  const showCmp = () => {
    const refs = written ? writtenIn(a, v).units : (v.r || []).map(c => unitsOf(c)[0]);
    const mine = d.art && refs.some(u => code(u) === d.art || u.a === unitsOf(d.art)[0].a);
    el.querySelector("#cmpOut").innerHTML = `<div class="feedback ok" style="margin-top:10px"><b>해석 예시</b>${esc(v.x || "")}
      <p class="small" style="margin:8px 0 0">참고 조문: ${[...new Set(refs.map(u => u.a === 0 ? "전문" : "제" + u.a + "조"))].join(", ")}</p>
      <p class="small" style="margin:6px 0 0">${mine ? "내가 고른 조문도 참고 조문에 들어 있어요. 설명이 예시와 어떻게 다른지 비교해 보세요." : "나는 다른 조문을 골랐어요. 정답이 하나인 것은 아니에요. 내 조문에서도 이 가치를 읽을 수 있는 이유가 설명에 잘 드러나 있는지 살펴보세요."}</p></div>`;
  };
  el.querySelector("#cmp").onclick = () => { d.compared = true; save(); showCmp(); };
  el.querySelector("#dv").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; S._dv = +b.dataset.k; save(); render(); });
  el.querySelector("#all").onclick = showAllArticles;
  el.querySelector("#n").onclick = () => go(6);
  drawArts(); checks(); if (d.compared) showCmp();
  requestAnimationFrame(drawD);
};

// 필사: 원문이 연하게 깔리고, 쓰는 대로 색이 바뀐다
let composing = false;
// 자동으로 채워지는 글자: 띄어쓰기, 줄바꿈, 가운뎃점, 따옴표. 학생은 이 글자들을 치지 않아도 된다.
const AUTO = /[\s·ㆍ“”‘’"']/;
VIEWS.copy = el => {
  const a = A();
  if (!S.copy) {
    const mine = (S.deep || []).filter(d => d.art).map(d => d.art);
    const us = [...mine.map(c => unitsOf(c)[0]), ...areaUnits(a).filter(u => !mine.includes(code(u)))].filter((u, i, arr) => u && arr.indexOf(u) === i);
    el.innerHTML = `<h2>마음에 드는 조문을 고르세요</h2><p class="lead">깊이 읽기에서 근거로 고른 조문을 필사하면, 그 조문을 한 번 더 천천히 읽게 돼요.</p>
      <div class="list">${us.map(u => `<button class="li" data-c="${code(u)}"><div class="r">${label(u)}${mine.includes(code(u)) ? `<span class="badge">내가 해석한 조문</span>` : ""}</div><div class="p">${esc(u.t)}</div></button>`).join("")}</div>`;
    el.querySelectorAll(".li").forEach(b => b.onclick = () => { S.copy = b.dataset.c; S.copyText = ""; save(); render(); });
    return;
  }
  const u = unitsOf(S.copy)[0], orig = u.t;
  el.innerHTML = `<div class="sheet"><div class="ref">${label(u)}</div>
      <div class="trace"><div class="layer" id="layer" aria-hidden="true"></div><textarea id="ta" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="${label(u)} 필사"></textarea></div></div>
    <div class="meter"><div class="bar"><i id="mb"></i></div><span id="mt">0%</span></div>
    <p class="hint">흐린 글자 위에 그대로 써 보세요. 틀린 글자는 빨갛게 표시돼요. <b>띄어쓰기, 줄바꿈, 가운뎃점(·), 따옴표(“ ”)는 자동으로 채워지니</b> 글자와 마침표·쉼표만 치면 돼요.</p>
    <label class="l" for="why">이 조문을 고른 이유</label>
    <textarea id="why" rows="2" placeholder="예: 누구도 차별받지 않는다는 문장이 우리 반에도 필요하다고 생각해서">${esc(S.copyWhy)}</textarea>
    <div class="row"><button class="btn ghost" id="other">다른 조문</button><button class="btn" id="n">다음</button></div>`;
  const ta = el.querySelector("#ta"), layer = el.querySelector("#layer");
  ta.value = S.copyText;
  // 원문에서 자동 글자를 뺀 '뼈대'와, 학생이 친 글에서 자동 글자를 뺀 것을 한 글자씩 비교한다.
  // 화면에는 원문 순서대로 그리고, 자동 글자는 학생이 그 자리까지 오면 저절로 나타난다.
  const skelLen = [...orig].filter(ch => !AUTO.test(ch)).length;
  const paint = () => {
    const t = [...ta.value].filter(ch => !AUTO.test(ch));
    let html = "", j = 0, ok = 0, caretDone = false;
    const caret = () => { if (!caretDone && document.activeElement === ta) { caretDone = true; return `<span class="caret"></span>`; } caretDone = true; return ""; };
    for (const o of orig) {
      if (AUTO.test(o)) { html += j < t.length || (j === t.length && j > 0 && !caretDone) ? `<span class="a">${esc(o)}</span>` : `<span class="g">${esc(o)}</span>`; continue; }
      if (j < t.length) {
        const c = t[j];
        if (composing && j === t.length - 1) html += `<span class="c">${esc(c)}</span>`;
        else if (c === o) { ok++; html += `<span class="k">${esc(o)}</span>`; }
        else html += `<span class="x">${esc(c)}</span>`;
        j++;
      } else { html += caret() + `<span class="g">${esc(o)}</span>`; }
    }
    while (j < t.length) html += `<span class="x">${esc(t[j++])}</span>`;
    html += caret();
    layer.innerHTML = html + "\u200b";
    const pct = Math.round(ok / skelLen * 100);
    el.querySelector("#mb").style.width = pct + "%";
    el.querySelector("#mt").innerHTML = ok === skelLen && t.length === skelLen ? `<span class="done">완성!</span>` : pct + "%";
    S.copyText = ta.value; S.copyPct = pct; save();
  };
  ta.addEventListener("focus", paint); ta.addEventListener("blur", paint);
  ta.addEventListener("compositionstart", () => { composing = true; });
  ta.addEventListener("compositionend", () => { composing = false; paint(); });
  ta.addEventListener("input", paint);
  el.querySelector("#why").oninput = e => { S.copyWhy = e.target.value; save(); };
  el.querySelector("#other").onclick = () => { S.copy = null; save(); render(); };
  el.querySelector("#n").onclick = () => go(7);
  paint(); setTimeout(() => ta.focus({preventScroll: true}), 150);
};

    el.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === issueTab));

// ---------- 8단계 (심화): 기준으로 실제 사례 따져 보기 ----------
const modeToggle = () => `<div class="mode" role="group" aria-label="질문 수준"><button data-mode="basic" aria-pressed="${S.qmode !== "deep"}">기본 질문</button><button data-mode="deep" aria-pressed="${S.qmode === "deep"}">심화 탐구</button></div>`;

const JUDGE = ["충족한다", "충족하지 못한다", "판단하기 어렵다"];
function deepQView(el) {

// ---------- 8단계: 토론 질문 ----------
// 질문 고르기 → 그 질문의 관련 사례만 다시 보기 → 의견 세우기(주장 · 헌법 근거 · 사례 근거 · 반론과 재반박) → 관련 조문 더 찾기
function areaIssues(a) {
  const cases = CONTENT.cases.filter(c => c.areas.includes(a.n)).map(c => ({id: "c:" + c.no, kind: "헌재 결정", title: c.name, sub: `${c.no} · ${c.result}`, facts: [["쟁점", c.issue], ["결정", c.decision]], arts: c.articles || []}));

  return [...cases, ...news];
}
function questionIssues(a, k) {
  const all = areaIssues(a), refs = ((CONTENT.qrefs || {})[String(a.n)] || [])[k] || [];
  const picked = all.filter(i => refs.includes(i.id));
  return picked.length ? picked : all;
}
const artLabel = n => +n === 0 ? "전문" : `제${n}조`;

VIEWS.question = el => {
  if (S.qmode === "deep" && DEEPQ[A().n]) return deepQView(el);
  const a = A(), qs = CONTENT.questions[String(a.n)] || [];
  S.op = Object.assign({claim: "", law: "", case: "", counter: "", rebut: ""}, S.op || {});
  S.useCases = S.useCases || []; S.moreArts = S.moreArts || [];
  const issues = S.q === null ? [] : questionIssues(a, S.q);
  const deeps = (S.deep || []).filter(d => d.expl);
  const recommended = [...new Set([...issues.flatMap(i => i.arts), ...(S.deep || []).filter(d => d.art).map(d => unitsOf(d.art)[0].a)])].filter(n => U.some(u => u.a === +n));
  el.innerHTML = `<h2>토론 질문</h2>${modeToggle()}<p class="lead">하나를 고르면 그 질문과 관련된 사례가 나와요. <b>심화 탐구</b>에서는 구체적인 판단 기준으로 실제 헌재 사건을 따져 볼 수 있어요.</p>
    <div>${qs.map((q, k) => `<button class="q" data-k="${k}" aria-pressed="${S.q === k}">${esc(q)}</button>`).join("")}</div>
    <div id="form" ${S.q === null ? "hidden" : ""}>
      <div class="stepbox"><div class="sn">1</div><div style="flex:1;min-width:0"><b>관련 사례 다시 보기</b>
        <p class="hint" style="margin:2px 0 8px">의견의 근거로 쓸 사례에 표시하세요.</p>
        <div class="artlist" style="max-height:none">${issues.map(i => `<div class="art ${S.useCases.includes(i.id) ? "sel" : ""}" data-id="${esc(i.id)}">
          <div class="r">${i.kind} · ${esc(i.sub)}</div><div style="font-weight:600;margin:2px 0 4px">${esc(i.title)}</div>
          ${i.facts.map(([k, v]) => `<div class="small"><b>${k}</b> ${esc(v)}</div>`).join("")}
          <button class="btn ghost usecase" style="padding:8px;margin-top:8px;font-size:.9rem">${S.useCases.includes(i.id) ? "근거로 표시됨 ✓" : "근거로 쓰기"}</button></div>`).join("") || `<p class="hint">연결된 사례가 아직 없어요.</p>`}</div></div></div>
      <div class="stepbox"><div class="sn">2</div><div style="flex:1;min-width:0"><b>의견 세우기</b>
        <label class="l" for="o1">① 나의 주장 <span class="hint">질문에 대한 나의 답을 한 문장으로</span></label>
        <textarea id="o1" rows="2" placeholder="예: 가산점은 다른 사람의 기회를 지나치게 빼앗는다면 공정하지 않다.">${esc(S.op.claim)}</textarea>
        <label class="l" for="o2">② 헌법 근거</label>
        <div class="chips" style="margin-bottom:6px">${deeps.map((d, k) => `<button class="chip pull" data-k="${k}" style="border:0;cursor:pointer">깊이 읽기 해석 가져오기: ${esc(d.value)}</button>`).join("")}
          <button class="chip" id="toFind" style="border:0;cursor:pointer">아래에서 조문 더 찾기 ↓</button></div>
        <textarea id="o2" rows="4" placeholder="깊이 읽기에서 쓴 해석을 가져오거나, 아래 ‘관련 조문 더 찾기’에서 조문을 넣어 주장과 이어 쓰세요.">${esc(S.op.law)}</textarea>
        <label class="l" for="o3">③ 사례 근거 <span class="hint">위에서 표시한 사례의 사실</span></label>
        <textarea id="o3" rows="3" placeholder="예: 헌법재판소는 98헌마363 사건에서 군 가산점 제도가 평등권과 공무담임권을 침해한다고 보았다.">${esc(S.op.case)}</textarea>
        <label class="l">④ 예상되는 반론과 나의 재반박</label>
        <details class="tips" style="margin:0 0 8px"><summary>반론을 쓰는 세 가지 방법과 예시 (학교 휴대전화 수거 규칙)</summary>
          ${COUNTER_EX.map(x => `<div class="ex"><b>${x.type}</b><p class="hint" style="margin:2px 0 6px">${x.how}</p>
            <div class="small"><span class="tag">반론</span> ${esc(x.c)}</div><div class="small" style="margin-top:4px"><span class="tag">재반박</span> ${esc(x.r)}</div></div>`).join("")}</details>
        <textarea id="o4" rows="2" placeholder="예상되는 반론: 나와 다른 입장의 사람은 무엇을 근거로 반대할까요?">${esc(S.op.counter)}</textarea>
        <textarea id="o5" rows="3" style="margin-top:8px" placeholder="나의 재반박: 그 반론을 인정할 부분은 인정하고, 조화시키는 방법이나 다른 조문으로 답하세요.">${esc(S.op.rebut)}</textarea>
        <ul class="checks" id="opchk"></ul></div></div>
      <div class="stepbox" id="findBox"><div class="sn">3</div><div style="flex:1;min-width:0"><b>관련 조문 더 찾기</b>
        <p class="hint" style="margin:2px 0 8px">낱말로 헌법 전체를 검색하세요. ‘헌법 근거에 넣기’를 누르면 ②에 조문 문장이 들어가요.</p>
        <div style="display:flex;gap:8px"><input type="text" id="sq" placeholder="예: 평등, 공무원, 기회"><button class="btn ghost" id="sb" style="width:auto;flex:none;white-space:nowrap;padding:10px 16px">찾기</button></div>
        <p class="small" style="margin:10px 0 4px">이 질문의 추천 조문</p><div class="chips" id="rec">${recommended.map(n => `<button class="chip" data-a="${n}" style="border:0;cursor:pointer">${artLabel(n)}</button>`).join("")}</div>
        <div id="sres" class="artlist" style="margin-top:10px"></div>
        <p class="small" style="margin:10px 0 4px">근거로 쓴 조문</p><div class="chips" id="mine"></div></div></div>
    </div>
    <div class="row"><button class="btn" id="n" disabled>스스로 점검하기</button></div>`;
  bindMode(el);
  const opText = () => [S.op.claim, S.op.law, S.op.case, S.op.counter, S.op.rebut].map(x => (x || "").trim()).filter(Boolean).join(" ");
  const drawMine = () => { el.querySelector("#mine").innerHTML = S.moreArts.length ? S.moreArts.map(n => `<button class="chip on" data-a="${n}" style="border:0;cursor:pointer">${artLabel(n)} ✕</button>`).join("") : `<span class="hint">아직 없어요</span>`; };
  const check = () => {
    const o = S.op, len = k => (o[k] || "").trim().length;
    const items = [
      [len("claim") >= 10, "주장을 한 문장으로 썼어요"],
      [/제\s?\d+\s?조|헌법|전문/.test(o.law || "") && len("law") >= 20, "헌법 조문을 근거로 들었어요"],
      [len("case") >= 15 && S.useCases.length > 0, "표시한 사례의 사실로 뒷받침했어요"],
      [len("counter") >= 15, "예상되는 반론을 구체적으로 썼어요"],
      [len("rebut") >= 25 && /(지만|그러나|하지만|따라서|그래서|방법|조화|제\s?\d+\s?조)/.test(o.rebut || ""), "반론에 답하는 이유나 대안을 제시했어요"]
    ];
    el.querySelector("#opchk").innerHTML = items.map(([ok, t]) => `<li class="${ok ? "ok" : ""}">${ok ? "●" : "○"} ${t}</li>`).join("");
    S.opScore = items.filter(i => i[0]).length; S.opinion = opText(); save();
    el.querySelector("#n").disabled = !(S.q !== null && len("claim") && opText().length >= 60);
  };
  el.querySelectorAll(".q").forEach(b => b.onclick = () => { S.q = +b.dataset.k; S.useCases = []; save(); render(); });
  [["o1", "claim"], ["o2", "law"], ["o3", "case"], ["o4", "counter"], ["o5", "rebut"]].forEach(([id, k]) => { const x = el.querySelector("#" + id); if (x) x.oninput = e => { S.op[k] = e.target.value; check(); }; });
  const addTo = (id, key, text) => { const ta = el.querySelector("#" + id); ta.value = (ta.value.trim() ? ta.value.trim() + " " : "") + text; S.op[key] = ta.value; check(); ta.focus(); };
  el.querySelectorAll(".pull").forEach(b => b.onclick = () => { const d = deeps[+b.dataset.k]; addTo("o2", "law", `${d.art ? "헌법 " + label(unitsOf(d.art)[0]) + "에 대해, " : ""}${d.expl}`); if (d.art) { const n = unitsOf(d.art)[0].a; if (!S.moreArts.includes(n)) { S.moreArts.push(n); save(); drawMine(); } } });
  const tf = el.querySelector("#toFind"); if (tf) tf.onclick = () => el.querySelector("#findBox").scrollIntoView({behavior: "smooth", block: "start"});
  el.querySelectorAll(".usecase").forEach(b => b.onclick = () => {
    const card = b.closest(".art"), id = card.dataset.id;
    S.useCases = S.useCases.includes(id) ? S.useCases.filter(x => x !== id) : [...S.useCases, id];
    card.classList.toggle("sel"); b.textContent = S.useCases.includes(id) ? "근거로 표시됨 ✓" : "근거로 쓰기"; save(); check();
  });
  // 조문을 ②에 넣기: 조문 문장을 그대로 인용해 근거 문장의 첫머리를 만들어 준다
  const insertArt = u => { const n = u.a; addTo("o2", "law", `헌법 ${label(u)}는 ‘${cut(u.t, 80)}’라고 정하고 있다.`); if (!S.moreArts.includes(n)) { S.moreArts.push(n); save(); drawMine(); check(); } };
  const showArt = n => { openDlg(artLabel(n), U.filter(u => u.a === +n).map(u => `<div class="unit"><div class="r">${label(u)}</div><div class="quote">${esc(u.t)}</div>
      <button class="btn ghost ins" data-c="${code(u)}" style="padding:8px;margin-top:6px;font-size:.9rem">헌법 근거에 넣기</button></div>`).join("")); };
  document.getElementById("dB").onclick = e => { const b = e.target.closest(".ins"); if (b) { insertArt(unitsOf(b.dataset.c)[0]); dlg.close(); } };
  el.querySelector("#rec").onclick = e => { const b = e.target.closest("[data-a]"); if (b) showArt(b.dataset.a); };
  el.querySelector("#mine").onclick = e => { const b = e.target.closest("[data-a]"); if (!b) return; S.moreArts = S.moreArts.filter(x => x !== +b.dataset.a); save(); drawMine(); check(); };
  const search = () => {
    const q = el.querySelector("#sq").value.trim(), box = el.querySelector("#sres");
    if (!q) { box.innerHTML = ""; return; }
    const hits = U.filter(u => u.t.includes(q) || u.n.includes(q)).slice(0, 12);
    box.innerHTML = hits.length ? hits.map(u => `<div class="art"><div class="r">${label(u)}</div><div class="quote">${highlight(cut(u.t, 140), [q])}</div>
      <button class="btn ghost ins2" data-c="${code(u)}" style="padding:8px;margin-top:6px;font-size:.9rem">헌법 근거에 넣기</button></div>`).join("")
      : `<p class="hint">‘${esc(q)}’가 들어간 조문이 없어요. 비슷한 낱말로 찾아보세요.</p>`;
  };
  if (S.q !== null) {
    el.querySelector("#sb").onclick = search;
    el.querySelector("#sq").onkeydown = e => { if (e.key === "Enter") search(); };
    el.querySelector("#sres").onclick = e => { const b = e.target.closest(".ins2"); if (b) { insertArt(unitsOf(b.dataset.c)[0]); b.textContent = "넣었어요 ✓"; } };
    drawMine(); check();
  }
  el.querySelector("#n").onclick = () => go(9);
};

// ---------- 9단계: 스스로 점검하기 (5점 척도) ----------
const SELF = [
  "이 영역의 헌법 조문에서 가치가 낱말로 쓰여 있는 곳을 찾을 수 있다.",
  "낱말이 없는 가치가 조문에 어떤 방식으로 담겨 있는지 근거 구절을 들어 설명할 수 있다.",
  "관련 사례에서 어떤 헌법 가치들이 서로 부딪치는지 말할 수 있다.",
  "헌법 조문과 사례를 근거로 나의 주장을 세우고, 예상되는 반론에 답할 수 있다.",
  "이번 탐구의 목표 문장이 왜 맞는지 오늘 읽은 조문과 사례로 설명할 수 있다."
];
const SCALE = ["전혀 아니다", "아니다", "보통이다", "그렇다", "매우 그렇다"];
VIEWS.self = el => {
  const a = A();
  S.self = S.self || {};
  el.innerHTML = `<h2>스스로 점검하기</h2><p class="lead">처음에 본 목표를 다시 보고, 각 문장이 나에게 얼마나 해당하는지 1~5점으로 골라 보세요.</p>
    <div class="idea" style="font-size:1.2rem">${esc(a.idea)}</div>
    <div class="selflist">${SELF.map((t, k) => `<div class="selfrow"><p><b>${k + 1}.</b> ${esc(t)}</p>
      <div class="lk" role="radiogroup" aria-label="${esc(t)}">${SCALE.map((l, v) => `<button data-k="${k}" data-v="${v + 1}" role="radio" aria-checked="${+S.self[k] === v + 1}" title="${l}"><b>${v + 1}</b><span>${l}</span></button>`).join("")}</div></div>`).join("")}</div>
    <p class="small" id="avg" style="text-align:right;margin:8px 0 0"></p>
    <label class="l" for="mc" style="font-family:var(--serif);font-size:1.25rem;margin-top:24px">나에게 헌법이란?</label>
    <div class="mycon"><span>나에게 헌법이란</span><input type="text" id="mc" value="${esc(S.myConst || "")}" placeholder="우리 반의 약속"><span>이다.</span></div>
    <label class="l" for="mw">왜냐하면</label><textarea id="mw" rows="2" placeholder="오늘 탐구한 조문이나 사례와 연결해 써 보세요.">${esc(S.myConstWhy || "")}</textarea>
    <div class="row"><button class="btn" id="n" disabled>제출하러 가기</button></div>`;
  const check = () => {
    const vals = SELF.map((_, k) => +S.self[k] || 0);
    el.querySelector("#avg").textContent = vals.every(Boolean) ? `평균 ${(vals.reduce((x, y) => x + y, 0) / vals.length).toFixed(1)}점` : "";
    el.querySelector("#n").disabled = !(vals.every(Boolean) && (S.myConst || "").trim());
  };
  el.querySelectorAll(".lk button").forEach(b => b.onclick = () => { S.self[b.dataset.k] = +b.dataset.v; save(); b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", x === b)); check(); });
  el.querySelector("#mc").oninput = e => { S.myConst = e.target.value; save(); check(); };
  el.querySelector("#mw").oninput = e => { S.myConstWhy = e.target.value; save(); };
  check(); el.querySelector("#n").onclick = () => go(10);
};

// 제출: 제출 코드를 만들어 선생님이 안내한 곳(클래스룸 등)에 붙여 넣는다
function payloadOf() {
  const a = A(), qs = CONTENT.questions[String(a.n)] || [];
  const u = S.copy ? unitsOf(S.copy)[0] : null;
  return {v: 8, step: S.step, klass: S.klass || "", name: (S.name || "").trim(), sid: (S.sid || "").trim(), at: new Date().toISOString(), area: a.n, areaName: a.name,
    found: S.found,
    deep: (S.deep || []).filter(d => d.art || d.expl).map(d => { const u = d.art ? unitsOf(d.art)[0] : null; const w = u ? u.t.split(/\s+/) : [];
      return {value: d.value, art: d.art, label: u ? label(u) : "", phrase: d.phrase.map(k => w[k]).join(" "), method: d.method, expl: d.expl, score: d.score || 0, compared: !!d.compared}; }),
    cls: a.vals.map(v => ({value: v.t, written: writtenIn(a, v).written, answer: (S.cls[v.t] || {}).answer, correct: (S.cls[v.t] || {}).correct})),
    copy: u ? {code: S.copy, label: label(u), text: S.copyText, pct: S.copyPct || 0, why: S.copyWhy} : null,
    q: S.qmode === "deep" && DEEPQ[a.n] ? (() => { const dq = DEEPQ[a.n], is = areaIssues(a).find(i => i.id === dq.ref);
        return {mode: "deep", text: dq.q, title: dq.title, crit: dq.crit.map((c, k) => ({name: c[0], judge: ((S.dq || {}).crit || {})[k]?.j || "", why: ((S.dq || {}).crit || {})[k]?.w || ""})),
          concl: (S.dq || {}).concl || "", counter: (S.dq || {}).counter || "", compared: !!(S.dq || {}).compared, cases: is ? [is.kind + ": " + is.title] : [], arts: S.moreArts || []}; })()
      : S.q === null ? null : {k: S.q, text: qs[S.q], opinion: S.opinion, op: S.op, score: S.opScore || 0,
      cases: (S.useCases || []).map(id => { const i = areaIssues(a).find(x => x.id === id); return i ? i.kind + ": " + i.title : id; }), arts: S.moreArts || []},
    self: SELF.map((t, k) => ({t, score: +((S.self || {})[k]) || 0})), myConst: S.myConst || "", myConstWhy: S.myConstWhy || ""};
}
VIEWS.submit = el => {
    el.innerHTML = '<h2>활동 제출</h2><p></p><button class="btn">담당 교사에게 제출</button><output role="status"></output>';
    el.querySelector("p").textContent = profile.klass + " · " + profile.sid + " " + profile.name;
    const button = el.querySelector("button");
    button.onclick = async () => {
      button.disabled = true;
      const status = el.querySelector("output");
      try {
        const stamp = await rpc("submit",{activity:payloadOf()});
        status.textContent = "제출 완료 · " + new Date(stamp).toLocaleString("ko-KR");
        button.textContent = "수정한 내용 다시 제출";
      } catch(error) { status.textContent = error.message; }
      finally { button.disabled = false; }
    };
  };
// ---------- 대화상자 ----------
const dlg = document.getElementById("dlg");
function openDlg(t, html) { document.getElementById("dT").textContent = t; document.getElementById("dB").innerHTML = html; if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", ""); }
document.getElementById("dX").onclick = () => dlg.close();
document.getElementById("glossBtn").onclick = () => openGlossary();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

login("student", () => { KEY = "cv-db-" + accountId; try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(blank(), JSON.parse(r)); } catch (e) {}
 Object.assign(S,{klass:profile.klass,sid:profile.sid,name:profile.name}); render(); });
</script>
